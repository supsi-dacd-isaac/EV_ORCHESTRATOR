version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.local
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:rw
    depends_on:
      - db

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      celery -A app.celery_apps.worker.celery_app worker -l INFO -Q celery
    working_dir: /app
    env_file:
      - .env.local
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      REDBEAT_REDIS_URL: redis://redis:6379/0
      FORECASTERS_ARTIFACTS_DIR: /app/app/services/ev_forecast/artifacts
    volumes:
      - ./app/services/ev_forecast/artifacts:/app/app/services/ev_forecast/artifacts
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_healthy

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      celery -A app.celery_apps.scheduler.scheduler_app worker --beat -l INFO -Q scheduler
    working_dir: /app
    env_file:
      - .env.local
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      REDBEAT_REDIS_URL: redis://redis:6379/0
      FORECASTERS_ARTIFACTS_DIR: /app/app/services/ev_forecast/artifacts
    volumes:
      - ./app/services/ev_forecast/artifacts:/app/app/services/ev_forecast/artifacts
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_healthy

volumes:
  pg_data:
