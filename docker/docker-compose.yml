version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  orchestrator:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgre@host.docker.internal:5432/ev_orchestrator}

  celery_worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: >
      celery -A app.celery_apps.worker.celery_app worker -l INFO -Q celery
    working_dir: /app
    volumes:
      - ../app/services/ev_forecast/artifacts:/app/app/services/ev_forecast/artifacts
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgre@host.docker.internal:5432/ev_orchestrator}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      REDBEAT_REDIS_URL: redis://redis:6379/0
      FORECASTERS_ARTIFACTS_DIR: /app/app/services/ev_forecast/artifacts
    depends_on:
      redis:
        condition: service_healthy

  celery_beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: >
      celery -A app.celery_apps.scheduler.scheduler_app worker --beat -l INFO -Q scheduler
    working_dir: /app
    volumes:
      - ../app/services/ev_forecast/artifacts:/app/app/services/ev_forecast/artifacts
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgre@host.docker.internal:5432/ev_orchestrator}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      REDBEAT_REDIS_URL: redis://redis:6379/0
      FORECASTERS_ARTIFACTS_DIR: /app/app/services/ev_forecast/artifacts
    depends_on:
      redis:
        condition: service_healthy