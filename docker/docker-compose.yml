version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ev_orchestrator}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  orchestrator:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-ev_orchestrator}
    ports:
      - "8000:8000"
    volumes:
      - ../models:/app/models:ro
    depends_on:
      - db

volumes:
  pg_data: