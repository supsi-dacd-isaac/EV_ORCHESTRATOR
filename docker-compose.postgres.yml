# Local Postgres for EV_ORCHESTRATOR dev / forecast testing.
# Usage (from repo root):
#   docker compose -f docker-compose.postgres.yml up -d
# Then:
#   export DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@localhost:5432/ev_orchestrator
#   python -m app.db.seed_local_dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ev_orchestrator}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ev_orchestrator"]
      interval: 3s
      timeout: 3s
      retries: 15
